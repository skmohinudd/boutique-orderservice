name: Order Service CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: orderservice-${{ github.ref }}
  cancel-in-progress: false

env:
  SERVICE_NAME: orderservice

  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "663130434910"
  ECR_REPOSITORY: boutique-orderservice
  EKS_CLUSTER_NAME: boutique-dev-eks

  K8S_NAMESPACE: boutique
  K8S_DEPLOYMENT: orderservice
  K8S_SERVICE: orderservice
  SERVICE_PORT: "8084"
  HELM_RELEASE: orderservice-dev

  PLATFORM_REPOSITORY: skmohinudd/boutique-platform-infra
  HELM_CHART_PATH: boutique-platform-infra/helm/orderservice

  SONAR_HOST_URL: http://44.199.205.21:9000
  SONAR_PROJECT_KEY: boutique-orderservice
  SONAR_PROJECT_NAME: Boutique Order Service


jobs:

  # ==========================================================
  # PULL REQUEST VALIDATION
  # ==========================================================

  pr-validation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Prepare Maven wrapper
        run: |
          sed -i 's/\r$//' mvnw
          chmod +x mvnw

      - name: Run tests
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

        run: |
          if ./mvnw -q \
            --batch-mode \
            --no-transfer-progress \
            -s .mvn/nexus-settings.xml \
            clean test \
            > /tmp/tests.log 2>&1
          then
            echo "Tests passed"
          else
            echo "Tests failed"
            tail -n 80 /tmp/tests.log
            exit 1
          fi

      - name: Run SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

        run: |
          if ./mvnw -q \
            --batch-mode \
            --no-transfer-progress \
            -s .mvn/nexus-settings.xml \
            org.sonarsource.scanner.maven:sonar-maven-plugin:5.7.0.6970:sonar \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
            -Dsonar.projectName="$SONAR_PROJECT_NAME" \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN" \
            > /tmp/sonar.log 2>&1
          then
            echo "SonarQube analysis completed"
          else
            echo "SonarQube analysis failed"
            tail -n 80 /tmp/sonar.log
            exit 1
          fi


  # ==========================================================
  # MAIN BRANCH DEPLOYMENT
  # ==========================================================

  deploy-main:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch')

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      - name: Checkout Order Service
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Prepare Maven wrapper
        run: |
          sed -i 's/\r$//' mvnw
          chmod +x mvnw


      # ======================================================
      # VERSION
      # ======================================================

      - name: Generate application version
        run: |
          APP_VERSION="1.0.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"

          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "JAR_NAME=orderservice-$APP_VERSION.jar" >> "$GITHUB_ENV"

          echo "Application version: $APP_VERSION"


      # ======================================================
      # REQUIRED SECRETS
      # ======================================================

      - name: Validate required secrets
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          AWS_GITHUB_ROLE_ARN: ${{ secrets.AWS_GITHUB_ROLE_ARN }}

        run: |
          for NAME in \
            SONAR_TOKEN \
            NEXUS_USERNAME \
            NEXUS_PASSWORD \
            AWS_GITHUB_ROLE_ARN
          do
            if [ -z "${!NAME}" ]; then
              echo "Missing required secret: $NAME"
              exit 1
            fi
          done

          echo "Required secrets verified"


      # ======================================================
      # MAVEN BUILD
      # ======================================================

      - name: Set Maven version
        run: |
          if ./mvnw -q \
            --batch-mode \
            --no-transfer-progress \
            versions:set \
            -DnewVersion="$APP_VERSION" \
            -DgenerateBackupPoms=false \
            > /tmp/version.log 2>&1
          then
            echo "Maven version updated"
          else
            echo "Maven version update failed"
            tail -n 60 /tmp/version.log
            exit 1
          fi


      - name: Test and build JAR
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

        run: |
          if ./mvnw -q \
            --batch-mode \
            --no-transfer-progress \
            -s .mvn/nexus-settings.xml \
            clean package \
            > /tmp/build.log 2>&1
          then
            test -f "target/$JAR_NAME"
            echo "Build completed: $JAR_NAME"
          else
            echo "Build failed"
            tail -n 100 /tmp/build.log
            exit 1
          fi


      # ======================================================
      # SONARQUBE
      # ======================================================

      - name: Run SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

        run: |
          if ./mvnw -q \
            --batch-mode \
            --no-transfer-progress \
            -s .mvn/nexus-settings.xml \
            org.sonarsource.scanner.maven:sonar-maven-plugin:5.7.0.6970:sonar \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
            -Dsonar.projectName="$SONAR_PROJECT_NAME" \
            -Dsonar.projectVersion="$APP_VERSION" \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN" \
            > /tmp/sonar.log 2>&1
          then
            echo "SonarQube analysis completed"
          else
            echo "SonarQube analysis failed"
            tail -n 80 /tmp/sonar.log
            exit 1
          fi


      # ======================================================
      # NEXUS
      # ======================================================

      - name: Publish JAR to Nexus
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

        run: |
          if ./mvnw -q \
            --batch-mode \
            --no-transfer-progress \
            -s .mvn/nexus-settings.xml \
            deploy \
            -DskipTests \
            > /tmp/nexus.log 2>&1
          then
            echo "Nexus artifact published: $JAR_NAME"
          else
            echo "Nexus publication failed"
            tail -n 80 /tmp/nexus.log
            exit 1
          fi


      # ======================================================
      # AWS OIDC
      # ======================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: orderservice-${{ github.run_id }}
          allowed-account-ids: "663130434910"


      - name: Validate AWS and ECR
        run: |
          ACCOUNT="$(aws sts get-caller-identity \
            --query Account \
            --output text)"

          test "$ACCOUNT" = "$AWS_ACCOUNT_ID"

          aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION" \
            > /dev/null

          echo "AWS and ECR verified"


      # ======================================================
      # DOCKER / ECR
      # ======================================================

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2


      - name: Build Docker image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}

        run: |
          IMAGE_REPOSITORY="${ECR_REGISTRY}/${ECR_REPOSITORY}"
          IMAGE_URI="${IMAGE_REPOSITORY}:${APP_VERSION}"

          echo "IMAGE_REPOSITORY=$IMAGE_REPOSITORY" >> "$GITHUB_ENV"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

          if docker build \
            --quiet \
            --label "org.opencontainers.image.version=$APP_VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$IMAGE_URI" \
            . \
            > /tmp/docker-build.log 2>&1
          then
            echo "Docker image built: $IMAGE_URI"
          else
            echo "Docker build failed"
            tail -n 100 /tmp/docker-build.log
            exit 1
          fi


      # Trivy intentionally disabled for now.


      - name: Push image to ECR
        run: |
          if docker push \
            --quiet \
            "$IMAGE_URI" \
            > /tmp/ecr-push.log 2>&1
          then
            echo "Image pushed to ECR: $IMAGE_URI"
          else
            echo "ECR push failed"
            tail -n 80 /tmp/ecr-push.log
            exit 1
          fi


      - name: Validate ECR image
        run: |
          IMAGE_DIGEST="$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$APP_VERSION" \
            --region "$AWS_REGION" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"

          test -n "$IMAGE_DIGEST"
          test "$IMAGE_DIGEST" != "None"

          echo "IMAGE_DIGEST=$IMAGE_DIGEST" >> "$GITHUB_ENV"

          echo "ECR image verified"


      # ======================================================
      # KUBECTL / HELM
      # ======================================================

      - name: Setup kubectl
        uses: azure/setup-kubectl@v5.1.0


      - name: Setup Helm
        uses: azure/setup-helm@v5.0.0


      - name: Checkout platform repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PLATFORM_REPOSITORY }}
          path: boutique-platform-infra
          persist-credentials: false


      - name: Validate Helm chart
        run: |
          test -f "$HELM_CHART_PATH/Chart.yaml"
          test -f "$HELM_CHART_PATH/values.yaml"

          helm lint "$HELM_CHART_PATH" > /dev/null

          helm template "$HELM_RELEASE" "$HELM_CHART_PATH" \
            --namespace "$K8S_NAMESPACE" \
            --set image.repository="$IMAGE_REPOSITORY" \
            --set image.tag="$APP_VERSION" \
            > /tmp/orderservice-rendered.yaml

          test -s /tmp/orderservice-rendered.yaml

          echo "Helm chart validated"


      # ======================================================
      # EKS ACCESS
      # ======================================================

      - name: Configure EKS access
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME" \
            > /dev/null

          test "$(kubectl auth can-i get deployments \
            -n "$K8S_NAMESPACE")" = "yes"

          test "$(kubectl auth can-i patch deployments \
            -n "$K8S_NAMESPACE")" = "yes"

          echo "EKS access verified"


      # ======================================================
      # ORDER SERVICE DEPENDENCIES
      # PostgreSQL + Kafka + RabbitMQ
      # ======================================================

      - name: Validate Order Service dependencies
        run: |
          FAILED=0

          for SERVICE in kafka rabbitmq
          do
            if kubectl get service "$SERVICE" \
              -n "$K8S_NAMESPACE" \
              > /dev/null 2>&1
            then
              echo "$SERVICE service available"
            else
              echo "$SERVICE service missing"
              FAILED=1
            fi
          done


          for SECRET in \
            boutique-rds-credentials \
            rabbitmq-credentials
          do
            if kubectl get secret "$SECRET" \
              -n "$K8S_NAMESPACE" \
              > /dev/null 2>&1
            then
              echo "$SECRET available"
            else
              echo "$SECRET missing"
              FAILED=1
            fi
          done


          if kubectl get secretproviderclass boutique-rds-secrets \
            -n "$K8S_NAMESPACE" \
            > /dev/null 2>&1
          then
            echo "AWS Secrets Manager CSI configuration available"
          else
            echo "boutique-rds-secrets missing"
            FAILED=1
          fi


          if [ "$FAILED" -ne 0 ]; then
            echo "Order Service dependency validation failed"
            exit 1
          fi


      # ======================================================
      # HELM CURRENT STATE
      # ======================================================

      - name: Check Helm release state
        run: |
          HELM_STATUS="$(helm status "$HELM_RELEASE" \
            -n "$K8S_NAMESPACE" \
            -o json \
            2>/dev/null \
            | jq -r '.info.status // "not-installed"' \
            || echo "not-installed")"

          echo "Current Helm status: $HELM_STATUS"

          case "$HELM_STATUS" in
            pending-install|pending-upgrade|pending-rollback)
              echo "Helm release has an unfinished operation"
              exit 1
              ;;
          esac


      # ======================================================
      # DEPLOY
      # ======================================================

      - name: Deploy Order Service with Helm
        run: |
          PREVIOUS_IMAGE="$(kubectl get deployment "$K8S_DEPLOYMENT" \
            -n "$K8S_NAMESPACE" \
            -o jsonpath='{.spec.template.spec.containers[0].image}' \
            2>/dev/null || true)"

          echo "Previous image: ${PREVIOUS_IMAGE:-none}"
          echo "New image     : $IMAGE_URI"


          if helm upgrade \
            --install \
            "$HELM_RELEASE" \
            "$HELM_CHART_PATH" \
            --namespace "$K8S_NAMESPACE" \
            --set image.repository="$IMAGE_REPOSITORY" \
            --set image.tag="$APP_VERSION" \
            --atomic \
            --cleanup-on-fail \
            --history-max 5 \
            --wait \
            --timeout 5m \
            > /tmp/helm-deploy.log 2>&1
          then
            echo "Helm deployment completed"
          else
            echo "Helm deployment failed"

            tail -n 100 /tmp/helm-deploy.log

            echo
            echo "Current Order Service pods:"

            kubectl get pods \
              -n "$K8S_NAMESPACE" \
              -l app="$SERVICE_NAME" \
              -o wide \
              || true

            exit 1
          fi


      # ======================================================
      # ROLLOUT VALIDATION
      # ======================================================

      - name: Validate Kubernetes rollout
        run: |
          if kubectl rollout status \
            deployment/"$K8S_DEPLOYMENT" \
            -n "$K8S_NAMESPACE" \
            --timeout=180s \
            > /tmp/rollout.log 2>&1
          then
            echo "Kubernetes rollout completed"
          else
            echo "Kubernetes rollout failed"

            tail -n 80 /tmp/rollout.log

            kubectl get pods \
              -n "$K8S_NAMESPACE" \
              -l app="$SERVICE_NAME" \
              -o wide \
              || true

            exit 1
          fi


      # ======================================================
      # IMAGE / REPLICA VALIDATION
      # ======================================================

      - name: Validate deployed image and replicas
        run: |
          DEPLOYED_IMAGE="$(kubectl get deployment "$K8S_DEPLOYMENT" \
            -n "$K8S_NAMESPACE" \
            -o jsonpath='{.spec.template.spec.containers[0].image}')"


          READY="$(kubectl get deployment "$K8S_DEPLOYMENT" \
            -n "$K8S_NAMESPACE" \
            -o jsonpath='{.status.readyReplicas}')"


          DESIRED="$(kubectl get deployment "$K8S_DEPLOYMENT" \
            -n "$K8S_NAMESPACE" \
            -o jsonpath='{.spec.replicas}')"


          if [[ "$DEPLOYED_IMAGE" != "$IMAGE_URI" ]]; then
            echo "Expected image: $IMAGE_URI"
            echo "Running image : $DEPLOYED_IMAGE"
            exit 1
          fi


          if [[ "${READY:-0}" != "$DESIRED" ]]; then
            echo "Ready replicas: ${READY:-0}/${DESIRED}"
            exit 1
          fi


          echo "Image verified: $DEPLOYED_IMAGE"
          echo "Ready replicas: $READY/$DESIRED"


      # ======================================================
      # APPLICATION HEALTH
      # ======================================================

      - name: Validate Order Service health
        run: |
          ENDPOINTS="$(kubectl get endpointslice \
            -n "$K8S_NAMESPACE" \
            -l kubernetes.io/service-name="$K8S_SERVICE" \
            -o jsonpath='{range .items[*].endpoints[*]}{.addresses[0]}{" "}{end}')"


          if [[ -z "$ENDPOINTS" ]]; then
            echo "Order Service has no ready endpoints"
            exit 1
          fi


          TEST_POD="orderservice-health-${GITHUB_RUN_ID}"


          cleanup() {
            kubectl delete pod "$TEST_POD" \
              -n "$K8S_NAMESPACE" \
              --ignore-not-found \
              > /dev/null 2>&1 || true
          }


          trap cleanup EXIT


          kubectl run "$TEST_POD" \
            -n "$K8S_NAMESPACE" \
            --restart=Never \
            --image=curlimages/curl \
            --command -- \
            curl \
              --fail \
              --silent \
              --show-error \
              --retry 5 \
              --retry-delay 3 \
              "http://${K8S_SERVICE}:${SERVICE_PORT}/actuator/health" \
            > /dev/null


          kubectl wait \
            --for=jsonpath='{.status.phase}'=Succeeded \
            pod/"$TEST_POD" \
            -n "$K8S_NAMESPACE" \
            --timeout=90s \
            > /dev/null


          HEALTH="$(kubectl logs "$TEST_POD" \
            -n "$K8S_NAMESPACE")"


          if echo "$HEALTH" | grep -q '"status":"UP"'
          then
            echo "Order Service health: UP"
          else
            echo "Order Service health check failed"
            echo "$HEALTH"
            exit 1
          fi


      # ======================================================
      # SUMMARY
      # ======================================================

      - name: Deployment summary
        run: |
          HELM_REVISION="$(helm history "$HELM_RELEASE" \
            -n "$K8S_NAMESPACE" \
            -o json \
            | jq -r '.[-1].revision')"


          echo "----------------------------------------"
          echo "Order Service deployment completed"
          echo "Version        : $APP_VERSION"
          echo "Nexus artifact : $JAR_NAME"
          echo "ECR image      : $IMAGE_URI"
          echo "ECR digest     : $IMAGE_DIGEST"
          echo "Helm release   : $HELM_RELEASE"
          echo "Helm revision  : $HELM_REVISION"
          echo "Deployment     : $K8S_DEPLOYMENT"
          echo "Health         : UP"
          echo "----------------------------------------"